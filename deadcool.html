<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>DeadCool</title>
    <style>
        body {

            background-color: #f4f4f4;

            align-items: center;
            height: 100vh;
        }

        .container {
            width: 80%;

            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);

            overflow: hidden;
            background-color: white;
        }

        .header {
            padding: 20px;
            background-color: #333;
            color: white;
            text-align: center;
        }

        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            height: 0;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            padding: 10px;
            background-color: #333;
            color: white;
            text-align: center;
        }

        a {

</head>
<body>
